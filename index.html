<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกค่าใช้จ่ายออฟฟิศ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }
    .fade-in { animation: fadeIn 0.25s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen pb-12 text-gray-800">

  <!-- Header -->
  <header class="bg-gradient-to-r from-indigo-700 to-blue-600 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center text-xl">
          <i class="fa-solid fa-file-invoice-dollar"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold leading-tight">ค่าใช้จ่ายออฟฟิศ</h1>
          <p class="text-xs text-indigo-100 flex items-center gap-1.5">
            <span id="syncDot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="syncText">เชื่อมต่อ Google Sheet พร้อมใช้งาน</span>
          </p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="fetchFromSheet()" class="bg-white/15 hover:bg-white/25 text-white text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1.5">
          <i class="fa-solid fa-rotate" id="refreshIcon"></i> ซิงค์ข้อมูล
        </button>
        <button onclick="exportCSV()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs px-3 py-2 rounded-lg font-semibold shadow-sm transition flex items-center gap-1.5">
          <i class="fa-solid fa-file-excel"></i> ส่งออก CSV
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- ฟอร์มบันทึกข้อมูล (ซ้าย) -->
    <section class="lg:col-span-7">
      <form id="expenseForm" onsubmit="handleSubmit(event)" class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="bg-indigo-50/70 px-6 py-4 border-b border-indigo-100 flex items-center justify-between">
          <h2 class="font-bold text-indigo-950 flex items-center gap-2">
            <i class="fa-solid fa-pen-to-square text-indigo-600"></i> บันทึกรายการใหม่
          </h2>
          <span class="text-xs text-indigo-600 font-medium">* จำเป็นต้องกรอก</span>
        </div>

        <div class="p-6 space-y-5">
          <!-- วันที่ -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">วันที่ <span class="text-red-500">*</span></label>
            <input type="date" id="date" required class="w-full rounded-xl border border-gray-300 px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
          </div>

          <!-- ประเภท (Section 1) -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">ประเภท <span class="text-red-500">*</span></label>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5" id="categoryGrid">
              <!-- สร้างปุ่มด้วย JS -->
            </div>
            <input type="hidden" id="category" required>
          </div>

          <!-- พื้นที่ Dynamic ตามประเภทที่เลือก (Section 2 - 14) -->
          <div id="dynamicSection" class="hidden fade-in bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4"></div>

          <!-- รายละเอียด -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">รายละเอียด <span class="text-red-500">*</span></label>
            <textarea id="details" rows="2" required placeholder="ระบุรายละเอียดงาน / จุดหมาย / รายการของ..." class="w-full rounded-xl border border-gray-300 px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
          </div>

          <!-- พิกัดสถานที่ (Location) -->
          <div class="bg-gray-50 p-3.5 rounded-xl border border-gray-200 space-y-2.5">
            <div class="flex items-center justify-between">
              <label class="text-sm font-semibold text-gray-700 flex items-center gap-1.5">
                <i class="fa-solid fa-location-dot text-rose-500"></i> สถานที่ / พิกัด GPS
              </label>
              <button type="button" onclick="getCurrentLocation()" id="gpsBtn" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold px-3 py-1.5 rounded-lg border border-rose-200 transition flex items-center gap-1.5">
                <i class="fa-solid fa-crosshairs"></i> ดึงพิกัดปัจจุบัน
              </button>
            </div>
            <input type="text" id="locationName" placeholder="พิมพ์ชื่อสถานที่ หรือกดปุ่มดึงพิกัดปัจจุบัน..." class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
            <div id="gpsCoordsText" class="text-xs text-gray-500 hidden"></div>
            <input type="hidden" id="lat">
            <input type="hidden" id="lng">
          </div>

          <!-- แนบไฟล์ / ถ่ายรูปพร้อมบีบอัด -->
          <div class="space-y-2.5">
            <label class="block text-sm font-semibold text-gray-700">แนบสลิป / ใบเสร็จ (บีบอัดไฟล์อัตโนมัติ)</label>
            <div class="grid grid-cols-2 gap-2.5">
              <button type="button" onclick="openCamera()" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl border-2 border-dashed border-indigo-300 bg-indigo-50/50 hover:bg-indigo-50 text-indigo-700 font-semibold text-xs transition">
                <i class="fa-solid fa-camera text-base"></i> ถ่ายรูปใบเสร็จ
              </button>
              <label class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl border-2 border-dashed border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold text-xs cursor-pointer transition">
                <i class="fa-solid fa-image text-base text-gray-500"></i> เลือกรูปจากเครื่อง
                <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
              </label>
            </div>

            <!-- กล้องถ่ายรูป -->
            <div id="cameraBox" class="hidden bg-black rounded-xl overflow-hidden relative">
              <video id="cameraVideo" autoplay playsinline class="w-full max-h-72 object-cover"></video>
              <div class="p-3 bg-gray-900 flex items-center justify-between">
                <button type="button" onclick="switchCamera()" class="text-white text-xs bg-white/20 px-3 py-1.5 rounded-lg">
                  <i class="fa-solid fa-camera-rotate"></i> สลับกล้อง
                </button>
                <button type="button" onclick="capturePhoto()" class="bg-white text-gray-900 font-bold text-xs px-4 py-2 rounded-full shadow">
                  <i class="fa-solid fa-circle-dot text-rose-600"></i> กดถ่ายภาพ
                </button>
                <button type="button" onclick="closeCamera()" class="text-gray-300 text-xs px-2 py-1">ยกเลิก</button>
              </div>
            </div>

            <!-- ตัวอย่างรูปที่บีบอัดแล้ว -->
            <div id="previewBox" class="hidden flex items-center justify-between bg-emerald-50 border border-emerald-200 p-2.5 rounded-xl">
              <div class="flex items-center gap-3">
                <img id="previewImg" class="w-12 h-12 rounded-lg object-cover border border-emerald-300 cursor-pointer" onclick="viewFullImage(this.src)">
                <div>
                  <p class="text-xs font-semibold text-emerald-900" id="previewName">สลิปใบเสร็จ.jpg</p>
                  <p class="text-[11px] text-emerald-700" id="previewSize">ย่อขนาดเรียบร้อย</p>
                </div>
              </div>
              <button type="button" onclick="clearImage()" class="text-rose-500 hover:text-rose-700 p-1.5 text-sm">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-cloud-arrow-up"></i> บันทึกข้อมูลลง Google Sheet
          </button>
        </div>
      </form>
    </section>

    <!-- สรุปยอดและประวัติ (ขวา) -->
    <section class="lg:col-span-5 space-y-5">
      <!-- การ์ดสรุปยอด -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
          <p class="text-xs text-gray-500">รวมค่าใช้จ่ายสุทธิ</p>
          <p class="text-xl font-bold text-indigo-700 mt-1" id="sumExpense">฿0.00</p>
        </div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
          <p class="text-xs text-gray-500">เก็บเงินสด / คืนเงิน</p>
          <p class="text-xl font-bold text-emerald-600 mt-1" id="sumCashIn">฿0.00</p>
        </div>
      </div>

      <!-- รายการล่าสุด -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-5 py-3.5 border-b border-gray-100 flex items-center justify-between">
          <h3 class="font-bold text-sm text-gray-800">ประวัติการบันทึกล่าสุด</h3>
          <span class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full font-semibold" id="recordCount">0 รายการ</span>
        </div>
        <div id="historyList" class="divide-y divide-gray-100 max-h-[520px] overflow-y-auto">
          <p class="text-center text-gray-400 text-sm py-10">กำลังโหลดข้อมูล...</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal ดูรูปขยาย -->
  <div id="imgModal" onclick="this.classList.add('hidden')" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
    <img id="modalImgSrc" class="max-w-full max-h-[90vh] rounded-xl shadow-2xl">
  </div>

  <script>
    // ลิงก์ Web App URL ของคุณที่ฝังไว้เรียบร้อยแล้ว
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwGSpCremeaCz1J7RGrfbhkjtz0UXf8gekJG82qvkC9xet70tST8NP1WHg7N1EmMBpU/exec";

    const CATEGORIES = [
      { id: 'วิ่งงานรถ', icon: 'fa-truck-fast', color: 'indigo' },
      { id: 'เบิกเงิน', icon: 'fa-hand-holding-dollar', color: 'amber' },
      { id: 'เชื้อเพลิง', icon: 'fa-gas-pump', color: 'rose' },
      { id: 'ล้างรถ', icon: 'fa-soap', color: 'cyan' },
      { id: 'ซ่อมรถ', icon: 'fa-screwdriver-wrench', color: 'orange' },
      { id: 'คืนเงิน', icon: 'fa-rotate-left', color: 'emerald' },
      { id: 'ฝากซื้อของ', icon: 'fa-bag-shopping', color: 'purple' },
      { id: 'อื่นๆ', icon: 'fa-ellipsis', color: 'slate' }
    ];

    let records = JSON.parse(localStorage.getItem('office_expenses_v1') || '[]');
    let compressedBase64 = '';
    let compressedFileName = '';
    let cameraStream = null;
    let facingMode = 'environment';

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('date').valueAsDate = new Date();
      renderCategories();
      SelectCategory('วิ่งงานรถ');
      renderHistory();
      fetchFromSheet();
    });

    function renderCategories() {
      const grid = document.getElementById('categoryGrid');
      grid.innerHTML = CATEGORIES.map(c => `
        <button type="button" onclick="SelectCategory('${c.id}')" id="cat_${c.id}"
          class="cat-btn flex items-center gap-2 p-2.5 rounded-xl border text-xs font-semibold transition text-left">
          <i class="fa-solid ${c.icon} text-sm"></i>
          <span>${c.id}</span>
        </button>
      `).join('');
    }

    function SelectCategory(catId) {
      document.getElementById('category').value = catId;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.className = 'cat-btn flex items-center gap-2 p-2.5 rounded-xl border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 text-xs font-semibold transition';
      });
      const activeBtn = document.getElementById('cat_' + catId);
      if (activeBtn) {
        activeBtn.className = 'cat-btn flex items-center gap-2 p-2.5 rounded-xl border-2 border-indigo-600 bg-indigo-50 text-indigo-700 text-xs font-bold transition shadow-sm';
      }
      renderDynamicFields(catId);
    }

    function renderDynamicFields(catId) {
      const box = document.getElementById('dynamicSection');
      box.classList.remove('hidden');

      if (catId === 'วิ่งงานรถ') {
        box.innerHTML = `
          <div class="text-xs font-bold text-indigo-900 border-b border-indigo-200 pb-1.5">ส่วนที่ 2: รายละเอียดวิ่งงานรถ</div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1">ค่าวิ่งงาน [฿] <span class="text-red-500">*</span></label>
              <input type="number" step="0.01" id="runFee" required placeholder="0.00" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1">เก็บเงินสด [฿] <span class="text-red-500">*</span></label>
              <input type="number" step="0.01" id="cashCollected" required placeholder="0.00" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1">ค่าทางด่วน [฿]</label>
              <input type="number" step="0.01" id="tollFee" placeholder="0.00" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1">ค่าจอดรถ [฿]</label>
              <input type="number" step="0.01" id="parkingFee" placeholder="0.00" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm">
            </div>
          </div>
          <div class="pt-2 border-t border-slate-200">
            <label class="block text-xs font-semibold text-gray-700 mb-1.5">💰 Tips 💰 <span class="text-red-500">*</span></label>
            <div class="flex gap-4">
              <label class="flex items-center gap-2 text-sm cursor-pointer">
                <input type="radio" name="hasTips" value="yes" onchange="toggleTipsInput(true)" required> 👍 มีทิป
              </label>
              <label class="flex items-center gap-2 text-sm cursor-pointer">
                <input type="radio" name="hasTips" value="no" onchange="toggleTipsInput(false)" checked> 👎 ไม่มีทิป
              </label>
            </div>
            <div id="tipsBox" class="hidden mt-3">
              <label class="block text-xs font-semibold text-gray-700 mb-1">จำนวนเงิน Tips [฿] (Section 14) <span class="text-red-500">*</span></label>
              <input type="number" step="0.01" id="tipsAmount" placeholder="0.00" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm">
            </div>
          </div>
        `;
      } else if (catId === 'เชื้อเพลิง') {
        box.innerHTML = `
          <div class="text-xs font-bold text-indigo-900 border-b border-indigo-200 pb-1.5">ส่วนที่ 4: เลือกชนิดเชื้อเพลิง</div>
          <div class="grid grid-cols-3 gap-2">
            <label class="border rounded-lg p-2.5 text-center text-xs font-bold cursor-pointer bg-white hover:bg-indigo-50">
              <input type="radio" name="fuelType" value="E20" checked onchange="updateFuelLabel('E20')" class="mr-1"> E20
            </label>
            <label class="border rounded-lg p-2.5 text-center text-xs font-bold cursor-pointer bg-white hover:bg-indigo-50">
              <input type="radio" name="fuelType" value="LPG" onchange="updateFuelLabel('LPG')" class="mr-1"> LPG
            </label>
            <label class="border rounded-lg p-2.5 text-center text-xs font-bold cursor-pointer bg-white hover:bg-indigo-50">
              <input type="radio" name="fuelType" value="NGV" onchange="updateFuelLabel('NGV')" class="mr-1"> NGV
            </label>
          </div>
          <div>
            <label id="fuelAmountLabel" class="block text-xs font-semibold text-gray-700 mb-1">E20 [฿] <span class="text-red-500">*</span></label>
            <input type="number" step="0.01" id="singleAmount" required placeholder="0.00" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm">
          </div>
        `;
      } else {
        const labelMap = {
          'เบิกเงิน': 'เบิกเงิน [฿]',
          'ล้างรถ': 'ล้างรถ [฿]',
          'ซ่อมรถ': 'ซ่อมรถ [฿]',
          'คืนเงิน': 'คืนเงิน [฿]',
          'ฝากซื้อของ': 'ซื้อของ [฿]',
          'อื่นๆ': 'อื่นๆ [฿]'
        };
        box.innerHTML = `
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">${labelMap[catId] || 'จำนวนเงิน [฿]'} <span class="text-red-500">*</span></label>
            <input type="number" step="0.01" id="singleAmount" required placeholder="0.00" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm">
          </div>
        `;
      }
    }

    function toggleTipsInput(show) {
      const tipsBox = document.getElementById('tipsBox');
      const tipsInput = document.getElementById('tipsAmount');
      if (show) {
        tipsBox.classList.remove('hidden');
        tipsInput.required = true;
      } else {
        tipsBox.classList.add('hidden');
        tipsInput.required = false;
        tipsInput.value = '';
      }
    }

    function updateFuelLabel(type) {
      document.getElementById('fuelAmountLabel').innerHTML = `${type} [฿] <span class="text-red-500">*</span>`;
    }

    // ดึงพิกัด GPS ปัจจุบัน
    function getCurrentLocation() {
      const btn = document.getElementById('gpsBtn');
      if (!navigator.geolocation) {
        alert('เบราว์เซอร์ของคุณไม่รองรับการดึงพิกัด GPS');
        return;
      }
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังหาพิกัด...';
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude.toFixed(6);
        const lng = pos.coords.longitude.toFixed(6);
        document.getElementById('lat').value = lat;
        document.getElementById('lng').value = lng;
        const coordsEl = document.getElementById('gpsCoordsText');
        coordsEl.classList.remove('hidden');
        coordsEl.innerHTML = `พิกัด: <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" class="text-indigo-600 underline">${lat}, ${lng}</a>`;

        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=th`);
          const data = await res.json();
          if (data && data.display_name && !document.getElementById('locationName').value) {
            document.getElementById('locationName').value = data.display_name.split(',').slice(0, 3).join(', ');
          }
        } catch (e) {}
        btn.innerHTML = '<i class="fa-solid fa-check text-emerald-600"></i> ดึงพิกัดสำเร็จ';
      }, () => {
        alert('ไม่สามารถดึงพิกัดได้ กรุณาอนุญาตการเข้าถึงตำแหน่งที่ตั้ง (Location)');
        btn.innerHTML = '<i class="fa-solid fa-crosshairs"></i> ดึงพิกัดปัจจุบัน';
      }, { enableHighAccuracy: true, timeout: 10000 });
    }

    // ระบบกล้องและบีบอัดรูปภาพ
    async function openCamera() {
      const box = document.getElementById('cameraBox');
      const video = document.getElementById('cameraVideo');
      try {
        if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode } });
        video.srcObject = cameraStream;
        box.classList.remove('hidden');
      } catch (err) {
        document.getElementById('fileInput').setAttribute('capture', 'environment');
        document.getElementById('fileInput').click();
      }
    }

    function switchCamera() {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      openCamera();
    }

    function closeCamera() {
      if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
      document.getElementById('cameraBox').classList.add('hidden');
    }

    function capturePhoto() {
      const video = document.getElementById('cameraVideo');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      closeCamera();
      compressImageFromSource(canvas.toDataURL('image/jpeg'), `camera_${Date.now()}.jpg`);
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => compressImageFromSource(ev.target.result, file.name);
      reader.readAsDataURL(file);
    }

    function compressImageFromSource(dataUrl, fileName) {
      const img = new Image();
      img.onload = () => {
        const MAX_SIDE = 1200;
        let w = img.width, h = img.height;
        if (w > h && w > MAX_SIDE) { h = Math.round(h * (MAX_SIDE / w)); w = MAX_SIDE; }
        else if (h > w && h > MAX_SIDE) { w = Math.round(w * (MAX_SIDE / h)); h = MAX_SIDE; }

        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);

        compressedBase64 = canvas.toDataURL('image/jpeg', 0.72);
        compressedFileName = fileName.replace(/\.[^/.]+$/, "") + ".jpg";

        const kb = Math.round((compressedBase64.length * 3 / 4) / 1024);
        document.getElementById('previewImg').src = compressedBase64;
        document.getElementById('previewName').textContent = compressedFileName;
        document.getElementById('previewSize').textContent = `ขนาดหลังบีบอัด: ~${kb} KB`;
        document.getElementById('previewBox').classList.remove('hidden');
      };
      img.src = dataUrl;
    }

    function clearImage() {
      compressedBase64 = '';
      compressedFileName = '';
      document.getElementById('fileInput').value = '';
      document.getElementById('previewBox').classList.add('hidden');
    }

    function viewFullImage(src) {
      document.getElementById('modalImgSrc').src = src;
      document.getElementById('imgModal').classList.remove('hidden');
    }

    // บันทึกข้อมูล
    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึกข้อมูล...';

      const cat = document.getElementById('category').value;
      const lat = document.getElementById('lat').value;
      const lng = document.getElementById('lng').value;

      const item = {
        id: 'EXP-' + Date.now(),
        timestamp: new Date().toLocaleString('th-TH'),
        date: document.getElementById('date').value,
        category: cat,
        details: document.getElementById('details').value,
        locationName: document.getElementById('locationName').value || '',
        lat, lng,
        mapUrl: (lat && lng) ? `https://www.google.com/maps?q=${lat},${lng}` : '',
        runFee: 0, cashCollected: 0, tollFee: 0, parkingFee: 0, tips: 0,
        fuelType: '', fuelAmount: 0, amount: 0,
        netExpense: 0, cashIn: 0,
        imageBase64: compressedBase64,
        imageName: compressedFileName
      };

      if (cat === 'วิ่งงานรถ') {
        item.runFee = parseFloat(document.getElementById('runFee').value || 0);
        item.cashCollected = parseFloat(document.getElementById('cashCollected').value || 0);
        item.tollFee = parseFloat(document.getElementById('tollFee').value || 0);
        item.parkingFee = parseFloat(document.getElementById('parkingFee').value || 0);
        item.tips = parseFloat(document.getElementById('tipsAmount')?.value || 0);
        item.netExpense = item.runFee + item.tollFee + item.parkingFee + item.tips;
        item.cashIn = item.cashCollected;
      } else if (cat === 'เชื้อเพลิง') {
        item.fuelType = document.querySelector('input[name="fuelType"]:checked').value;
        item.fuelAmount = parseFloat(document.getElementById('singleAmount').value || 0);
        item.netExpense = item.fuelAmount;
      } else if (cat === 'คืนเงิน') {
        item.amount = parseFloat(document.getElementById('singleAmount').value || 0);
        item.cashIn = item.amount;
      } else {
        item.amount = parseFloat(document.getElementById('singleAmount').value || 0);
        item.netExpense = item.amount;
      }

      records.unshift(item);
      localStorage.setItem('office_expenses_v1', JSON.stringify(records));
      renderHistory();

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'saveExpense', data: item })
        });
      } catch (err) {
        console.warn('Sync warning:', err);
      }

      document.getElementById('details').value = '';
      clearImage();
      SelectCategory(cat);
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-check"></i> บันทึกเรียบร้อย!';
      setTimeout(() => {
        btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> บันทึกข้อมูลลง Google Sheet';
      }, 1800);
    }

    async function fetchFromSheet() {
      const icon = document.getElementById('refreshIcon');
      icon.classList.add('fa-spin');
      try {
        const res = await fetch(`${GAS_WEB_APP_URL}?action=getExpenses`);
        const json = await res.json();
        if (json && Array.isArray(json.data) && json.data.length > 0) {
          records = json.data;
          localStorage.setItem('office_expenses_v1', JSON.stringify(records));
          renderHistory();
        }
      } catch (e) {
        console.log('ใช้ข้อมูล LocalStorage ล่าสุด');
      }
      icon.classList.remove('fa-spin');
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      document.getElementById('recordCount').textContent = `${records.length} รายการ`;

      let totalExp = 0, totalCash = 0;
      records.forEach(r => {
        totalExp += Number(r.netExpense || 0);
        totalCash += Number(r.cashIn || 0);
      });

      document.getElementById('sumExpense').textContent = `฿${totalExp.toLocaleString('th-TH', { minimumFractionDigits: 2 })}`;
      document.getElementById('sumCashIn').textContent = `฿${totalCash.toLocaleString('th-TH', { minimumFractionDigits: 2 })}`;

      if (records.length === 0) {
        list.innerHTML = `<p class="text-center text-gray-400 text-sm py-10">ยังไม่มีรายการบันทึก</p>`;
        return;
      }

      list.innerHTML = records.map(r => `
        <div class="p-4 hover:bg-gray-50 transition flex items-start justify-between gap-3">
          <div class="space-y-1">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold px-2 py-0.5 rounded bg-indigo-100 text-indigo-800">${r.category}${r.fuelType ? ` (${r.fuelType})` : ''}</span>
              <span class="text-xs text-gray-400">${r.date || ''}</span>
            </div>
            <p class="text-sm font-medium text-gray-800">${r.details || '-'}</p>
            ${r.locationName || r.mapUrl ? `
              <a href="${r.mapUrl || '#'}" target="_blank" class="inline-flex items-center gap-1 text-[11px] text-rose-600 bg-rose-50 px-2 py-0.5 rounded border border-rose-200">
                <i class="fa-solid fa-location-dot"></i> ${r.locationName || 'ดูแผนที่ GPS'}
              </a>
            ` : ''}
          </div>
          <div class="text-right shrink-0">
            ${r.netExpense > 0 ? `<p class="text-sm font-bold text-rose-600">-฿${Number(r.netExpense).toLocaleString()}</p>` : ''}
            ${r.cashIn > 0 ? `<p class="text-xs font-semibold text-emerald-600">+฿${Number(r.cashIn).toLocaleString()}</p>` : ''}
            ${(r.imageBase64 || r.fileUrl) ? `
              <button onclick="viewFullImage('${r.imageBase64 || r.fileUrl}')" class="mt-1 text-[11px] text-indigo-600 underline">
                <i class="fa-solid fa-receipt"></i> ดูสลิป
              </button>
            ` : ''}
          </div>
        </div>
      `).join('');
    }

    function exportCSV() {
      if (records.length === 0) return alert('ยังไม่มีข้อมูลสำหรับส่งออก');
      const headers = ['วันที่', 'ประเภท', 'รายละเอียด', 'สถานที่', 'พิกัดแผนที่', 'รายจ่ายสุทธิ', 'รายรับ/เงินสด'];
      const rows = records.map(r => [
        r.date, r.category, `"${(r.details || '').replace(/"/g, '""')}"`,
        `"${(r.locationName || '').replace(/"/g, '""')}"`, r.mapUrl || '', r.netExpense || 0, r.cashIn || 0
      ]);
      const csv = '\uFEFF' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `office_expenses_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }
  </script>
